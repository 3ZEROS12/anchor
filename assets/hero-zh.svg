<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 420" width="840" height="420">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3339" />
      <stop offset="100%" stop-color="#232a2e" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="15" width="800" height="385" rx="12" fill="#1e2326" stroke="#343f44" stroke-width="1.2" />
    <path d="M 20,27 A 12,12 0 0,1 32,15 L 808,15 A 12,12 0 0,1 820,27 L 820,52 L 20,52 Z" fill="url(#headerGrad)" stroke="#343f44" stroke-width="1" />
    <line x1="20" y1="52" x2="820" y2="52" stroke="#2d353b" stroke-width="1" />
    <circle cx="42" cy="33.5" r="5.5" fill="#e67e80" />
    <circle cx="60" cy="33.5" r="5.5" fill="#dbbc7f" />
    <circle cx="78" cy="33.5" r="5.5" fill="#a7c080" />
    <text x="420" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#859289">
      ⌖ anchor v1.0 · 跨会话 Todo 施工坞 · 输入框下方树状进度面板 · 原对话一键穿越
    </text>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve">
    <!-- Simulated Pi Input Box -->
    <rect x="45" y="72" width="750" height="42" rx="6" fill="#232a2e" stroke="#4f5b58" stroke-width="1.2" />
    <text x="62" y="98">
      <tspan fill="#a7c080" font-weight="bold">❯ </tspan>
      <tspan fill="#d3c6aa">便签: 重构鉴权流: 1. 抽出接口 2. 替换HttpOnly Cookie 3. 补齐集成单测</tspan>
    </text>

    <!-- Below-Editor Expanded Tree Dock -->
    <rect x="45" y="124" width="750" height="142" rx="8" fill="#232a2e" stroke="#a7c080" stroke-width="1" />
    <text x="62" y="149">
      <tspan fill="#a7c080" font-weight="bold">⌖ </tspan>
      <tspan fill="#859289">#1 </tspan>
      <tspan fill="#dbbc7f" font-weight="bold">[■□□□ 1/3] </tspan>
      <tspan fill="#d3c6aa" font-weight="bold">重构鉴权流 </tspan>
      <tspan fill="#7fbbb3">(app · auth.ts ↪)</tspan>
      <tspan fill="#56635f">                [Alt+A 折叠]</tspan>
    </text>
    <text x="62" y="175">
      <tspan fill="#56635f">├─ </tspan>
      <tspan fill="#a7c080">✓ </tspan>
      <tspan fill="#7a8478">1. </tspan>
      <tspan fill="#7a8478" text-decoration="line-through">抽出接口</tspan>
    </text>
    <text x="62" y="201">
      <tspan fill="#56635f">├─ </tspan>
      <tspan fill="#dbbc7f">◐ </tspan>
      <tspan fill="#7a8478">2. </tspan>
      <tspan fill="#a7c080" font-weight="bold">替换HttpOnly Cookie </tspan>
      <tspan fill="#859289">(editing auth.ts)</tspan>
    </text>
    <text x="62" y="227">
      <tspan fill="#56635f">├─ </tspan>
      <tspan fill="#7a8478">○ 3. </tspan>
      <tspan fill="#d3c6aa">补齐集成单测 </tspan>
      <tspan fill="#859289">⛓ #2</tspan>
    </text>
    <text x="62" y="251">
      <tspan fill="#56635f">└─ </tspan>
      <tspan fill="#7a8478">+1 已完成  │  📌 #2 检查网关超时降级重试 (3h ago)</tspan>
    </text>

    <!-- Collapsed 1-Line Mode Preview -->
    <text x="45" y="294" fill="#859289" font-size="12">按 `Alt+A`（或 `/anchor fold`）随时一键折叠为 1 行极简便签条：</text>
    <rect x="45" y="304" width="750" height="34" rx="6" fill="#292b28" stroke="#3a464c" stroke-width="1" />
    <text x="62" y="326">
      <tspan fill="#a7c080" font-weight="bold">⌖ </tspan>
      <tspan fill="#859289">#1 </tspan>
      <tspan fill="#dbbc7f" font-weight="bold">[■□□□ 1/3] </tspan>
      <tspan fill="#d3c6aa">重构鉴权流 </tspan>
      <tspan fill="#7fbbb3">▸ 替换HttpOnly Cookie </tspan>
      <tspan fill="#859289">(editing auth.ts) (app · auth.ts ↪)</tspan>
    </text>

    <text x="45" y="370" fill="#7a8478">
      <tspan>  常用命令: </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`便签: &lt;内容&gt;`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/anchor`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/step 1`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/back`</tspan>
      <tspan> (切回原对话 ↪) · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/done 1`</tspan>
    </text>
  </g>
</svg>
