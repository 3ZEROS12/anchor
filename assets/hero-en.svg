<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 410" width="840" height="410">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3339" />
      <stop offset="100%" stop-color="#232a2e" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="15" width="800" height="370" rx="12" fill="#1e2326" stroke="#343f44" stroke-width="1.2" />
    <path d="M 20,27 A 12,12 0 0,1 32,15 L 808,15 A 12,12 0 0,1 820,27 L 820,52 L 20,52 Z" fill="url(#headerGrad)" stroke="#343f44" stroke-width="1" />
    <line x1="20" y1="52" x2="820" y2="52" stroke="#2d353b" stroke-width="1" />
    <circle cx="42" cy="33.5" r="5.5" fill="#e67e80" />
    <circle cx="60" cy="33.5" r="5.5" fill="#dbbc7f" />
    <circle cx="78" cy="33.5" r="5.5" fill="#a7c080" />
    <text x="420" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#859289">
      ⌖ anchor (v0.5.0) · Below-Editor Sticky Strip · Progress Bar · Session Teleport
    </text>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve">
    <text x="45" y="84">
      <tspan fill="#7fbbb3" font-weight="bold">⌖ Notes (3):</tspan>
    </text>

    <text x="45" y="116">
      <tspan fill="#859289">  01  </tspan>
      <tspan fill="#a7c080" font-weight="bold">[■■□□ 2/4] </tspan>
      <tspan fill="#d3c6aa">Refactor auth flow                  </tspan>
      <tspan fill="#7fbbb3">app · auth.ts ↪        </tspan>
      <tspan fill="#7a8478">25m ago</tspan>
    </text>

    <text x="45" y="144">
      <tspan fill="#859289">  02  </tspan>
      <tspan fill="#d3c6aa">Double-check rate limit fallback on timeout   </tspan>
      <tspan fill="#7fbbb3">app · gateway.ts ↪     </tspan>
      <tspan fill="#7a8478">3h ago</tspan>
    </text>

    <text x="45" y="172">
      <tspan fill="#859289">  03  </tspan>
      <tspan fill="#859289">Read external architecture notes first        </tspan>
      <tspan fill="#7a8478">College/优化 · notes.md </tspan>
      <tspan fill="#56635f">8d ago · quiet</tspan>
    </text>

    <!-- Simulated Pi Input Box + Below-Editor Persistent Sticky Strip -->
    <rect x="45" y="204" width="750" height="44" rx="6" fill="#232a2e" stroke="#4f5b58" stroke-width="1.2" />
    <text x="62" y="231">
      <tspan fill="#a7c080" font-weight="bold">❯ </tspan>
      <tspan fill="#d3c6aa">pin: Refactor auth flow: 1. Extract interface 2. HttpOnly cookie 3. Unit tests</tspan>
    </text>

    <!-- Below-Editor Sticky Strip -->
    <rect x="45" y="256" width="750" height="36" rx="6" fill="#292b28" stroke="#a7c080" stroke-width="1" stroke-dasharray="4,3" />
    <text x="62" y="279">
      <tspan fill="#a7c080" font-weight="bold">⌖ </tspan>
      <tspan fill="#859289">#1 </tspan>
      <tspan fill="#dbbc7f" font-weight="bold">[■■□□ 2/4] </tspan>
      <tspan fill="#d3c6aa">Refactor auth flow </tspan>
      <tspan fill="#7fbbb3">▸ HttpOnly cookie </tspan>
      <tspan fill="#859289">(app · auth.ts ↪)</tspan>
    </text>

    <text x="45" y="324" fill="#859289">
      <tspan>  • </tspan>
      <tspan fill="#d3c6aa" font-weight="bold">0ms Instant Stick</tspan>
      <tspan>: Type </tspan>
      <tspan fill="#7fbbb3">`pin: &lt;note&gt;`</tspan>
      <tspan> (or </tspan>
      <tspan fill="#7fbbb3">`/pin`</tspan>
      <tspan>) — docked below editor, never collides with aboveEditor HUDs.</tspan>
    </text>
    <text x="45" y="348" fill="#859289">
      <tspan>  • </tspan>
      <tspan fill="#d3c6aa" font-weight="bold">Session Teleport (↪)</tspan>
      <tspan>: Select any note in </tspan>
      <tspan fill="#7fbbb3">`/anchor`</tspan>
      <tspan> or run </tspan>
      <tspan fill="#7fbbb3">`/anchor jump 1`</tspan>
      <tspan> to resume its conversation.</tspan>
    </text>
  </g>
</svg>
