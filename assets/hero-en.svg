<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b3339" />
      <stop offset="100%" stop-color="#232a2e" />
    </linearGradient>
  </defs>

  <g filter="url(#shadow)">
    <rect x="20" y="15" width="800" height="350" rx="12" fill="#1e2326" stroke="#343f44" stroke-width="1.2" />
    <path d="M 20,27 A 12,12 0 0,1 32,15 L 808,15 A 12,12 0 0,1 820,27 L 820,52 L 20,52 Z" fill="url(#headerGrad)" stroke="#343f44" stroke-width="1" />
    <line x1="20" y1="52" x2="820" y2="52" stroke="#2d353b" stroke-width="1" />
    <circle cx="42" cy="33.5" r="5.5" fill="#e67e80" />
    <circle cx="60" cy="33.5" r="5.5" fill="#dbbc7f" />
    <circle cx="78" cy="33.5" r="5.5" fill="#a7c080" />
    <text x="420" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#859289">
      ⌖ anchor · A Digital Sticky Note for Your Terminal
    </text>
  </g>

  <g font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="13" xml:space="preserve">
    <text x="45" y="86">
      <tspan fill="#a7c080" font-weight="bold">~/Workspace/app</tspan>
      <tspan fill="#7fbbb3"> ❯ </tspan>
      <tspan fill="#d3c6aa" font-weight="bold">anchor</tspan>
    </text>

    <text x="45" y="120">
      <tspan fill="#7fbbb3" font-weight="bold">⌖ Notes (3):</tspan>
    </text>

    <text x="45" y="154">
      <tspan fill="#859289">  01  </tspan>
      <tspan fill="#d3c6aa">Switch session token to HttpOnly cookie     </tspan>
      <tspan fill="#7fbbb3">app · auth.ts          </tspan>
      <tspan fill="#7a8478">25m ago</tspan>
    </text>

    <text x="45" y="182">
      <tspan fill="#859289">  02  </tspan>
      <tspan fill="#d3c6aa">Double-check rate limit fallback on timeout </tspan>
      <tspan fill="#7fbbb3">app · gateway.ts       </tspan>
      <tspan fill="#7a8478">3h ago</tspan>
    </text>

    <text x="45" y="210">
      <tspan fill="#859289">  03  </tspan>
      <tspan fill="#859289">Read external architecture notes first      </tspan>
      <tspan fill="#7a8478">College/优化 · notes.md </tspan>
      <tspan fill="#56635f">8d ago · quiet</tspan>
    </text>

    <rect x="45" y="242" width="750" height="58" rx="6" fill="#232a2e" stroke="#3a464c" stroke-width="1" />
    <text x="62" y="266" fill="#dbbc7f">1. Stick a note:  /pin Switch session token to HttpOnly cookie in src/auth.ts</text>
    <text x="62" y="287" fill="#a7c080">2. Auto-tear off: git commit -m "feat: switch session token to HttpOnly cookie" ➔ ⌖ Torn off #1</text>

    <text x="45" y="334" fill="#7a8478">
      <tspan>  Commands: </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/pin &lt;note&gt;`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/anchor`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/done 1`</tspan>
      <tspan> · </tspan>
      <tspan fill="#7fbbb3" font-weight="bold">`/anchor undo`</tspan>
    </text>
  </g>
</svg>
